name: TileMate Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TileMate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build TileMate
        run: npm run build

      - name: Show build output
        run: |
          echo "Build completed."
          echo "Output directories:"
          find . -maxdepth 2 -type d \
            \( -name "dist" -o -name ".output" \) \
            -print
